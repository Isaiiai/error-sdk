<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isaii AI • Under Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #06060B;
  color: #fff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
  padding: clamp(16px, 4vw, 40px);
}

/* Background Layers & Animated Orbs */
.bg-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.5;
  transition: all 1s ease;
}

.orb-magenta {
  width: 480px;
  height: 480px;
  background: #D81B60;
  top: -140px;
  left: -140px;
  animation: et-float-1 20s infinite ease-in-out;
}

.orb-blue {
  width: 440px;
  height: 440px;
  background: #1E88E5;
  right: -140px;
  bottom: -140px;
  animation: et-float-2 25s infinite ease-in-out;
}

.orb-cyan {
  width: 320px;
  height: 320px;
  background: #06B6D4;
  left: 50%;
  top: 62%;
  transform: translate(-50%, -50%);
  opacity: 0.4;
  animation: et-float-3 18s infinite ease-in-out;
}

.grid-overlay {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(circle at center, black 35%, transparent 90%);
  -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 90%);
}

@keyframes et-float-1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(40px, -40px) scale(1.1); }
}

@keyframes et-float-2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-30px, 30px) scale(0.95); }
}

@keyframes et-float-3 {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-45%, -55%) scale(1.05); }
}

/* Glassmorphic Card Container */
.et-card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 680px;
  padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 48px);
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 80px rgba(216, 27, 96, 0.06);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.et-card:hover {
  border-color: rgba(255, 255, 255, 0.12);
  box-shadow: 0 35px 80px rgba(0, 0, 0, 0.7), 0 0 100px rgba(30, 136, 229, 0.08);
}

/* Logo wrapper */
.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.logo-wrap img {
  width: 96px;
  height: 96px;
  object-fit: contain;
  border-radius: 22px;
  background: #fff;
  padding: 10px;
  box-shadow: 0 0 40px rgba(30, 136, 229, 0.35);
}

/* Badge overlay */
.badge {
  display: inline-block;
  padding: 8px 16px;
  border-radius: 50px;
  background: rgba(216, 27, 96, 0.16);
  border: 1px solid rgba(216, 27, 96, 0.32);
  color: #F9A8D4;
  font-size: 13px;
  letter-spacing: 0.4px;
  margin-bottom: 20px;
}

/* Typography styles */
h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(28px, 6vw, 46px);
  line-height: 1.15;
  margin: 0 0 16px 0;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.gradient {
  background: linear-gradient(90deg, #D81B60, #7C3AED, #1E88E5, #22D3EE);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

p {
  color: #B5B5C3;
  font-size: clamp(14px, 2vw, 16px);
  line-height: 1.7;
  max-width: 540px;
  margin: 0 auto 8px auto;
}

/* Meta Pills info */
.meta-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
  margin-bottom: 8px;
}

.meta-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 12px;
  color: #CFCFD8;
  text-transform: capitalize;
}

/* Action buttons */
.buttons-row {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 28px;
  flex-wrap: wrap;
}

.et-btn {
  padding: 12px 26px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-family: inherit;
}

.et-btn-primary {
  background: linear-gradient(135deg, #D81B60 0%, #7C3AED 50%, #1E88E5 100%);
  background-size: 200% auto;
  color: #fff;
  border: none;
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.25);
}

.et-btn-primary:hover {
  background-position: right center;
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(124, 58, 237, 0.45);
}

.et-btn-secondary {
  background: rgba(255, 255, 255, 0.04);
  color: #E2E8F0;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.et-btn-secondary:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.2);
  color: #fff;
  transform: translateY(-2px);
}

/* Footer credits */
.footer {
  margin-top: 40px;
  color: #666;
  font-size: 12px;
  letter-spacing: 0.05em;
}
</style>
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="orb orb-magenta"></div>
  <div class="orb orb-blue"></div>
  <div class="orb orb-cyan"></div>
  <div class="grid-overlay"></div>
</div>

<div class="et-card">
  <div class="logo-wrap">
    <img src="apps/asserts/image.png" alt="Isaii AI" width="96" height="96">
  </div>

  <div class="badge">Platform upgrade in progress</div>

  <h1>The system is under <span class="gradient">Maintenance</span></h1>

  <p>
    Our engineers are deploying improvements for a faster, smarter experience. 
    We’ll be back online shortly — thank you for your patience.
  </p>

  <div class="meta-row">
    <span class="meta-pill">Scheduled Upgrade</span>
    <span class="meta-pill">Severity · Low</span>
  </div>

  <div class="buttons-row">
    <a href="mailto:support@isaii.in" class="et-btn et-btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
      Contact support
    </a>
    <a href="https://isaii.in" target="_blank" rel="noreferrer" class="et-btn et-btn-secondary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Visit Website
    </a>
  </div>

  <div class="footer">
    © 2026 Isaii AI · isaii.in
  </div>
</div>

</body>
</html>
